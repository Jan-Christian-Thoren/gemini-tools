# Nivåstyrd modell- och ambitionsnivå för alla Gemini-anrop (det enda stället där modeller,
# resonemang, gränser och priser anges). Workflows hårdkodar aldrig modell-ID:n.
#
# Val av nivå, i prioritetsordning:
#   1. Kommentarkommando  /gemini snabb|standard|djup [fri fråga]   (djup bara för djup_command_users)
#   2. Label              ai:snabb | ai:standard | ai:djup
#   3. Default            snabb
# Ingen nivå eskalerar automatiskt: modellreserven inom en nivå går bara till samma eller
# billigare modell.

owner: Jan-Christian-Thoren          # GitHub-organisationen; kan inte själv skriva kommentarer
djup_command_users: [jthoren69]     # personkonton som får köra /gemini djup (Jans konto)
default_tier: snabb
command_associations: [OWNER, MEMBER, COLLABORATOR]   # vilka som får använda /gemini
max_input_bytes: 200000          # större diff eller bilagor trunkeras och det står i rapporten
djup_per_item_per_hour: 1        # högst ett djup-anrop per PR/issue och timme
heartbeat_s: 60                  # livstecken i Actions-loggen medan ett anrop pågår
settle_s: 20                     # väntan vid etikett-/öppna-händelser; samlar flera etiketter till en körning

# Månadsbudget per repo, räknad på de uppskattade kostnaderna i botens sidfötter sedan den 1:a.
# Över gränsen körs standard och djup som snabb (det står i sidfoten). Snabb påverkas inte.
# PLATSHÅLLARE: sätt värdet när pristabellen stämts av mot fakturan.
budget:
  monthly_sek_per_repo: 20
  applies_to: [standard, djup]
  fallback_tier: snabb

# Tidsgränser per nivå: request_timeout_s per modellanrop, run_budget_s för hela körningen
# (alla försök och reservmodeller). Jobbets timeout-minutes i workflowen ska vara större än
# run_budget_s plus uppstart, så att en statusrapport hinner postas i stället för att GitHub
# dödar jobbet. Uppmätt på Vertex (djup + sökning + hög thinking): median ~6,7 min, p95 ~8,7 min.

tiers:
  snabb:
    description: PR-sammanfattning, lint-förklaring, statusrapport
    models: [gemini-3.8-flash]
    thinking_level: minimal
    max_output_tokens: 2000
    grounding: false
    request_timeout_s: 180
    run_budget_s: 420
    job_timeout_minutes: 12
  standard:
    description: vanlig kodgranskning
    models: [gemini-3.1-pro-preview]
    thinking_level: low
    max_output_tokens: 6000
    grounding: false
    request_timeout_s: 360
    run_budget_s: 720
    job_timeout_minutes: 18
  djup:
    description: arkitektur, svår felsökning, säkerhet, utredningar
    models: [gemini-4-argon, gemini-3.1-pro-preview]
    thinking_level: high
    max_output_tokens: 16000
    grounding: true
    request_timeout_s: 660
    run_budget_s: 1380
    job_timeout_minutes: 28

# Vad varje modell stöder (verifierat med tools/smoke_test.py på Vertex AI global, 2026-11-01).
# En nivås thinking_level som modellen inte stöder höjs till närmaste stödda nivå uppåt.
# gemini-2.5-pro listas av models.list() men ger 404 på global och används därför inte i nivåerna.
# Per modell: thinking_levels som stöds, och valfritt request_timeout_s (ersätter nivåns),
# max_attempts (standard 3), slow_attempt_s och retry_thinking_level.
model_params:
  gemini-3.8-flash:       {thinking_levels: [low, medium, high]}       # MINIMAL ger 400
  gemini-3.1-pro-preview: {thinking_levels: [low, medium, high]}
  # Tung modell: kort timeout per anrop, högst ett omförsök (med lägre resonemang), och direkt till
  # reserven om ett misslyckat försök redan tagit mer än slow_attempt_s. Lämnar budget åt reserven.
  gemini-4-argon:
    thinking_levels: [low, medium, high]
    request_timeout_s: 300
    max_attempts: 2
    slow_attempt_s: 180
    retry_thinking_level: medium
  gemini-2.5-pro:         {thinking_levels: [], thinking_budget: true}

# Gamla profilnamn (GEMINI_PROFILE) pekar på en nivå.
aliases:
  standard_review: snabb
  deep_investigation: djup

# UPPSKATTNING. USD per 1 miljon tokens; resonemangstokens debiteras som utdata.
# PLATSHÅLLARE: verifiera mot Vertex AI:s prislista och oktoberfakturan innan siffrorna används
# till något annat än att jämföra nivåer med varandra.
pricing:
  usd_to_sek: 10.5
  models:
    gemini-3.8-flash:       {input: 0.30, output: 2.50}
    gemini-3.1-pro-preview: {input: 2.00, output: 12.00}
    gemini-2.5-pro:         {input: 1.25, output: 10.00}
    gemini-4-argon:         {input: 4.00, output: 24.00}
